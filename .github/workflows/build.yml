name: Build Check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/WinDownloader.slnx

      - name: Build
        run: >
          dotnet build src/WinDownloader.slnx
          --configuration Release
          --no-restore
          -p:Platform=x64
